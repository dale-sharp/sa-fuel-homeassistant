[project]
name = "sa-fuel-homeassistant"
version = "1.1.9"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.1",
    "ty>=0.0.61",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
log_cli = false

[tool.coverage.run]
source = ["custom_components/sa_fuel_pricing"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
blanket-ignore-comment = "error"
