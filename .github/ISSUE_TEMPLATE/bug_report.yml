name: "Bug report"
description: "Report a bug with the SA Fuel Pricing integration"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Before you open a new issue, search through the [existing issues](https://github.com/dale-sharp/sa-fuel-homeassistant/issues) to see if others have had the same problem.
  - type: textarea
    attributes:
      label: "System Health details"
      description: "Paste the data from the System Health card in Home Assistant (Settings > System > Repairs > ... menu > System information, or see https://www.home-assistant.io/more-info/system-health#github-issues)"
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have enabled debug logging for my installation.
          required: true
        - label: I have filled out the issue template to the best of my ability.
          required: true
        - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
          required: true
        - label: This issue is not a duplicate of any [previous issues](https://github.com/dale-sharp/sa-fuel-homeassistant/issues?q=is%3Aissue+label%3A%22bug%22).
          required: true
  - type: textarea
    attributes:
      label: "Describe the issue"
      description: "A clear and concise description of what the issue is."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Reproduction steps"
      description: "Without steps to reproduce, it will be hard to fix. It is very important that you fill out this part. Issues without it may be closed."
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Debug logs"
      description: "Enable debug logging for `custom_components.sa_fuel_pricing` (Settings > Devices & Services > SA Fuel Pricing > ... menu > Enable debug logging, reproduce the issue, then disable it to download the log). Paste the relevant excerpt here — include enough context to see the failure occur, not just a single line."
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Diagnostics dump"
      description: "Optional but helpful: download diagnostics from Settings > Devices & Services > SA Fuel Pricing > ... menu > Download diagnostics, and drag the file here."
    validations:
      required: false
